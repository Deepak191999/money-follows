[project]
name = "money-follows-backend"
version = "0.1.0"
description = "Money Follows API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "pydantic[email]>=2.8",
]

[project.scripts]
seed = "app.seed:main"
dev = "app.main:dev"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
