<app-nav />
<main>
  <h1>Groups</h1>
  @if (groups().length === 0) {
    <p class="muted">You are not in any group yet.</p>
  } @else {
    <ul class="list">
      @for (g of groups(); track g.id) {
        <li>
          <a [routerLink]="['/groups', g.id]">{{ g.name }}</a>
        </li>
      }
    </ul>
  }

  <section class="card">
    <h2>New group</h2>
    <form (ngSubmit)="create()" class="row">
      <label>
        Name
        <input type="text" name="name" required [(ngModel)]="name" />
      </label>
      <button type="submit" [disabled]="busy()">Create</button>
    </form>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </section>
</main>
